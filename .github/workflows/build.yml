name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --project-name study_planner --platforms=android
      - name: Set MAIN app version
        run: |
          python3 - <<'PY'
          p = 'android/app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          s = s.replace('versionCode = flutterVersionCode', 'versionCode = 1')
          s = s.replace('versionName = flutterVersionName', 'versionName = "1.0"')
          open(p, 'w', encoding='utf-8').write(s)
          print('MAIN app version = 1.0 (versionCode 1)')
          PY
      - name: Configure MAIN app identity
        run: |
          python3 - <<'EOF'
          import re
          p = 'android/app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          s, count = re.subn(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.daily_trackar.help"', s, count=1)
          if count != 1:
              raise SystemExit('Could not set main applicationId')
          open(p, 'w', encoding='utf-8').write(s)
          print('MAIN applicationId = com.daily_trackar.help')
          EOF
      - name: Configure Android and Kotlin compatibility
        run: |
          python3 - <<'EOF'
          import re
          gp = 'android/gradle.properties'
          props = open(gp, encoding='utf-8').read()
          for k in ('android.newDsl', 'android.builtInKotlin', 'kotlin.jvm.target.validation.mode'):
              props = re.sub(r'(?m)^' + re.escape(k) + r'=.*\n?', '', props)
          props = props.rstrip('\n') + '\nandroid.newDsl=false\nandroid.builtInKotlin=false\nkotlin.jvm.target.validation.mode=warning\n'
          open(gp, 'w', encoding='utf-8').write(props)

          rp = 'android/build.gradle.kts'
          r = open(rp, encoding='utf-8').read()
          if 'JVM_17' not in r:
              r += '\nsubprojects {\n    if (name != "app") {\n        tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {\n            compilerOptions {\n                jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)\n            }\n        }\n    }\n}\n'
              open(rp, 'w', encoding='utf-8').write(r)

          r = open(rp, encoding='utf-8').read()
          if 'androidx.glance' not in r:
              r += '\nsubprojects {\n    configurations.configureEach {\n        resolutionStrategy.eachDependency {\n            if (requested.group == "androidx.glance" && !requested.name.contains("wear")) {\n                useVersion("1.2.0")\n            }\n        }\n    }\n}\n'
              open(rp, 'w', encoding='utf-8').write(r)

          p = 'android/app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          m = re.search(r'sourceCompatibility\s*=\s*JavaVersion\.VERSION_(\d+)', s)
          jv = m.group(1) if m else '17'
          if jv not in ('8', '11', '17', '21'):
              jv = '17'
          if re.search(r'kotlinOptions\s*\{[^{}]*\}', s):
              s = re.sub(r'kotlinOptions\s*\{[^{}]*\}\s*', '', s)
              s += '\nkotlin {\n    compilerOptions {\n        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("' + jv + '"))\n    }\n}\n'
          open(p, 'w', encoding='utf-8').write(s)
          print('newDsl=false, builtInKotlin=false, kotlin jvmTarget =', jv)
          EOF
      - run: flutter pub get
      - name: Generate Android launcher icons
        run: |
          test -f assets/app_icon.png || (echo "Missing assets/app_icon.png. Upload the Daily Tracker logo to this path." && exit 1)
          dart run flutter_launcher_icons
      - run: sed -i 's/android:label="[^"]*"/android:label="Daily Tracker"/' android/app/src/main/AndroidManifest.xml
      - name: Patch Android for notifications
        run: |
          python3 - <<'EOF'
          mp = 'android/app/src/main/AndroidManifest.xml'
          m = open(mp, encoding='utf-8').read()
          perms = "\n".join([
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>',
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>',
              '    <uses-permission android:name="android.permission.VIBRATE"/>',
              '    ',
          ])
          receivers = "\n".join([
              '',
              '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />',
              '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">',
              '            <intent-filter>',
              '                <action android:name="android.intent.action.BOOT_COMPLETED"/>',
              '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>',
              '                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>',
              '                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>',
              '            </intent-filter>',
              '        </receiver>',
              '    ',
          ])
          if 'POST_NOTIFICATIONS' not in m:
              m = m.replace('<application', perms + '<application', 1)
              m = m.replace('</application>', receivers + '</application>', 1)
          open(mp, 'w', encoding='utf-8').write(m)

          gp = 'android/app/build.gradle.kts'
          g = open(gp, encoding='utf-8').read()
          if 'isCoreLibraryDesugaringEnabled' not in g:
              assert 'compileOptions {' in g
              g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          open(gp, 'w', encoding='utf-8').write(g)
          print('patched manifest and gradle')
          EOF
      - name: Register Android exam home-screen widgets
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          receivers = '''
                  <receiver android:name="com.example.study_planner.ExamCompactWidgetProvider" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/exam_widget_compact_info"/>
                  </receiver>
                  <receiver android:name="com.example.study_planner.ExamDetailedWidgetProvider" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/exam_widget_detailed_info"/>
                  </receiver>
          '''
          if 'ExamCompactWidgetProvider' not in s:
              s = s.replace('</application>', receivers + '\n    </application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('registered compact and detailed exam widgets')
          EOF
      - name: Setup signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          python3 - <<'EOF'
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          block = "\n".join([
              '    signingConfigs {',
              '        create("release") {',
              '            storeFile = file("upload-keystore.jks")',
              '            storePassword = System.getenv("KEYSTORE_PASSWORD")',
              '            keyAlias = System.getenv("KEY_ALIAS")',
              '            keyPassword = System.getenv("KEY_PASSWORD")',
              '        }',
              '    }',
              '',
              '    buildTypes {',
          ])
          s = s.replace('    buildTypes {', block, 1)
          s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          assert 'create("release")' in s and 'getByName("release")' in s
          open(p, 'w').write(s)
          EOF
      - name: Preserve generic signatures for scheduled notifications
        run: |
          cat > android/app/proguard-rules.pro <<'EOF'
          # flutter_local_notifications uses Gson TypeToken to restore scheduled notifications.
          # R8 must retain generic type signatures for these classes.
          -keepattributes Signature
          -keep class com.google.gson.reflect.TypeToken { *; }
          -keep class * extends com.google.gson.reflect.TypeToken
          EOF
          python3 - <<'EOF'
          p = 'android/app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          # Add the ProGuard rules to the release build type without changing signing.
          build_types = s.find('buildTypes {')
          if build_types < 0:
              raise SystemExit('Could not find buildTypes block in app Gradle file')
          release = s.find('release {', build_types)
          if release < 0:
              raise SystemExit('Could not find release build type in app Gradle file')
          block_end = s.find('\n        }', release)
          if block_end < 0:
              raise SystemExit('Could not find end of release build type')
          block = s[release:block_end]
          rule = 'proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
          if 'proguard-rules.pro' not in block:
              s = s[:block_end] + '\n            ' + rule + s[block_end:]
          open(p, 'w', encoding='utf-8').write(s)
          print('Configured release ProGuard rules for Gson TypeToken signatures')
          EOF
      - name: Show generated Gradle files (for debugging)
        run: |
          cat android/gradle.properties
          echo ---------- settings
          cat android/settings.gradle.kts
          echo ---------- root build
          cat android/build.gradle.kts
          echo ---------- app build
          cat android/app/build.gradle.kts
      - run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Name MAIN APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Daily Tracker.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Daily Tracker-apk
          path: build/app/outputs/flutter-apk/Daily Tracker.apk
          
