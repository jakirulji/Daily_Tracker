name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --project-name study_planner --platforms=android
      - run: flutter pub get
      - name: Generate Android launcher icons
        run: |
          test -f assets/app_icon.png || (echo "Missing assets/app_icon.png. Upload the Daily Tracker logo to this path." && exit 1)
          dart run flutter_launcher_icons
      - run: sed -i 's/android:label="[^"]*"/android:label="Daily Tracker"/' android/app/src/main/AndroidManifest.xml
      - name: Patch Android for notifications
        run: |
          python3 - <<'EOF'
          mp = 'android/app/src/main/AndroidManifest.xml'
          m = open(mp, encoding='utf-8').read()
          perms = "\\n".join([
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>',
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>',
              '    <uses-permission android:name="android.permission.VIBRATE"/>',
              '    ',
          ])
          receivers = "\\n".join([
              '',
              '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />',
              '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">',
              '            <intent-filter>',
              '                <action android:name="android.intent.action.BOOT_COMPLETED"/>',
              '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>',
              '                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>',
              '                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>',
              '            </intent-filter>',
              '        </receiver>',
              '    ',
          ])
          if 'POST_NOTIFICATIONS' not in m:
              m = m.replace('<application', perms + '<application', 1)
              m = m.replace('</application>', receivers + '</application>', 1)
          open(mp, 'w', encoding='utf-8').write(m)

          gp = 'android/app/build.gradle.kts'
          g = open(gp, encoding='utf-8').read()
          if 'isCoreLibraryDesugaringEnabled' not in g:
              assert 'compileOptions {' in g
              g = g.replace('compileOptions {', 'compileOptions {\\n        isCoreLibraryDesugaringEnabled = true', 1)
              g += '\\ndependencies {\\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\\n}\\n'
          open(gp, 'w', encoding='utf-8').write(g)
          print('patched manifest and gradle')
          EOF
      - name: Setup signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          python3 - <<'EOF'
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          block = "\\n".join([
              '    signingConfigs {',
              '        create("release") {',
              '            storeFile = file("upload-keystore.jks")',
              '            storePassword = System.getenv("KEYSTORE_PASSWORD")',
              '            keyAlias = System.getenv("KEY_ALIAS")',
              '            keyPassword = System.getenv("KEY_PASSWORD")',
              '        }',
              '    }',
              '',
              '    buildTypes {',
          ])
          s = s.replace('    buildTypes {', block, 1)
          s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          assert 'create("release")' in s and 'getByName("release")' in s
          open(p, 'w').write(s)
          EOF
      - run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: build/app/outputs/flutter-apk/app-release.apk
