name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --project-name study_planner --platforms=android
      - run: flutter pub get
      - name: Setup signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          python3 - <<'EOF'
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          block = "\n".join([
              '    signingConfigs {',
              '        create("release") {',
              '            storeFile = file("upload-keystore.jks")',
              '            storePassword = System.getenv("KEYSTORE_PASSWORD")',
              '            keyAlias = System.getenv("KEY_ALIAS")',
              '            keyPassword = System.getenv("KEY_PASSWORD")',
              '        }',
              '    }',
              '',
              '    buildTypes {',
          ])
          s = s.replace('    buildTypes {', block, 1)
          s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          assert 'create("release")' in s and 'getByName("release")' in s
          open(p, 'w').write(s)
          EOF
      - run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: build/app/outputs/flutter-apk/app-release.apk
