name: study_planner
description: Daily study planner and tracker
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  share_plus: ^10.1.4
  path_provider: ^2.1.0
  file_picker: ^8.1.2

# file_picker 8.x is compiled against SDK 34; newer flutter_plugin_android_lifecycle needs SDK 36.
# Pinning the older lifecycle plugin fixes the checkReleaseAarMetadata build error.
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

flutter:
  uses-material-design: true
