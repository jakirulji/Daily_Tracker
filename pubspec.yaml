name: study_planner
description: Daily study planner and tracker
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  share_plus: ^10.1.4
  path_provider: ^2.1.0
  file_picker: ^8.1.2
  home_widget: ^0.8.0

# file_picker 8.x is compiled against SDK 34; newer flutter_plugin_android_lifecycle needs SDK 36.
# Pinning the older lifecycle plugin fixes the checkReleaseAarMetadata build error.
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#171A3B"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
